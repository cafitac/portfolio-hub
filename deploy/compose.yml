# 맥스튜디오에서 도는 포트폴리오 허브 — 정적 파일(nginx) + 전용 Cloudflare 터널.
# colima 가상 머신은 외장 SSD 만 마운트하므로 사이트 파일과 터널 자격 증명은 $HUB_DATA_DIR 에 둔다(remote.sh 가 복사).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ${HUB_DATA_DIR}/site:/usr/share/nginx/html:ro
      - ${HUB_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8795:80"
    restart: unless-stopped
    logging: *logging

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${HUB_DATA_DIR}/tunnel:/etc/cloudflared:ro
    depends_on: [web]
    restart: unless-stopped
    logging: *logging
